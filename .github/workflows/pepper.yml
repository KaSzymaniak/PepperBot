name: Pepper bot

on:
  schedule:
    # Każde zadanie na koniec samo uruchamia następne (ostatni krok), więc bot działa
    # bez przerw. Harmonogram to tylko zapas, gdyby łańcuch się przerwał - GitHub i tak
    # często pomija zaplanowane uruchomienia. Nieparzyste minuty, bo pełne godziny są zatłoczone.
    - cron: "17 * * * *"
  workflow_dispatch: {}   # ręczne uruchomienie z zakładki Actions

# Jedno zadanie naraz. Nowe czeka w kolejce, aż obecne skończy (GitHub trzyma w kolejce
# najwyżej jedno, więc zapasowe z harmonogramu nie zdubluje łańcucha).
concurrency:
  group: pepper-bot
  cancel-in-progress: false

permissions:
  contents: write   # potrzebne do commitowania seen.json
  actions: write    # potrzebne do uruchomienia następnego zadania

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LOOP_MINUTES: 58
      CHECK_EVERY: 60
      # Ceneo blokuje serwery GitHuba, więc tutaj sprawdzamy tylko Amazon
      PRICE_SOURCES: amazon
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sprawdzaj Pepper co minutę i ceny co 30 min
        run: |
          git config user.name "pepper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            python pepper_bot.py --once || echo "Sprawdzenie nie powiodło się, próbuję dalej"
            # ceny na Amazonie - skrypt sam pilnuje, żeby sprawdzać co 30 min
            python price_watch.py --once || echo "Sprawdzenie cen nie powiodło się, próbuję dalej"
            if ! git diff --quiet -- seen.json price_state.json 2>/dev/null || [ -n "$(git ls-files --others -- seen.json price_state.json)" ]; then
              git add seen.json price_state.json 2>/dev/null || git add seen.json
              git commit -q -m "Aktualizacja stanu bota"
              git pull -q --rebase -X theirs || git rebase --abort
              git push -q || echo "Push nie powiódł się, spróbuję przy następnym commicie"
            fi
            sleep $(( CHECK_EVERY - ( $(date +%s) - start ) > 0 ? CHECK_EVERY - ( $(date +%s) - start ) : 1 ))
          done

      # Nie uruchamia się po ręcznym anulowaniu (Cancel workflow), więc łańcuch można zatrzymać.
      # Na stałe: Actions -> Pepper bot -> ... -> Disable workflow.
      - name: Uruchom następne zadanie
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://api.github.com/repos/${{ github.repository }}/actions/workflows/pepper.yml/dispatches"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -d '{"ref":"${{ github.ref_name }}"}' "$url"
          echo "Następne zadanie uruchomione"
